<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs><style>.h{font:bold 30px Arial;fill:#2e2419}.t{font:bold 20px Arial;fill:#30261b}.s{font:16px Arial;fill:#4b3c2b}.b{fill:#fff8ea;stroke:#9b702e;stroke-width:2;rx:14}.a{stroke:#805c2e;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#805c2e"/></marker></defs>
<rect width="1400" height="620" fill="#f7f0e4"/><text x="700" y="50" text-anchor="middle" class="h">LUỒNG COMMENT / GIFT ĐẾN AVATAR</text>
<rect class="b" x="40" y="130" width="190" height="100"/><text class="t" x="135" y="170" text-anchor="middle">LIVE event</text><text class="s" x="135" y="200" text-anchor="middle">comment / gift</text>
<path class="a" d="M230 180 H280"/><rect class="b" x="285" y="130" width="190" height="100"/><text class="t" x="380" y="170" text-anchor="middle">Normalize</text><text class="s" x="380" y="200" text-anchor="middle">validate payload</text>
<path class="a" d="M475 180 H525"/><rect class="b" x="530" y="130" width="190" height="100"/><text class="t" x="625" y="170" text-anchor="middle">Deduplicate</text><text class="s" x="625" y="200" text-anchor="middle">event / streak key</text>
<path class="a" d="M720 180 H770"/><rect class="b" x="775" y="130" width="190" height="100"/><text class="t" x="870" y="170" text-anchor="middle">Resolve user</text><text class="s" x="870" y="200" text-anchor="middle">platformUserId</text>
<path class="a" d="M965 180 H1015"/><rect class="b" x="1020" y="130" width="190" height="100"/><text class="t" x="1115" y="170" text-anchor="middle">Game logic</text><text class="s" x="1115" y="200" text-anchor="middle">command / gift map</text>
<path class="a" d="M1210 180 H1260"/><rect class="b" x="1265" y="130" width="105" height="100"/><text class="t" x="1318" y="170" text-anchor="middle" font-size="17">Emit</text><text class="s" x="1318" y="200" text-anchor="middle" font-size="13">socket</text>
<path class="a" d="M1318 230 V330 H1060"/><rect class="b" x="810" y="330" width="500" height="120"/><text class="t" x="1060" y="375" text-anchor="middle">3D client phản hồi</text><text class="s" x="1060" y="410" text-anchor="middle">avatar animation • scene effect • bubble • ranking</text>
<path class="a" d="M810 390 H590"/><rect class="b" x="90" y="330" width="500" height="120"/><text class="t" x="340" y="375" text-anchor="middle">Ghi nhận / quan sát</text><text class="s" x="340" y="410" text-anchor="middle">event log • action count • gift count • metrics</text>
<text class="s" x="700" y="540" text-anchor="middle">Nếu chưa có avatar: tạo khi có viewer_joined; nếu provider không hỗ trợ join, fallback tạo ở tương tác đầu tiên.</text>
</svg>
