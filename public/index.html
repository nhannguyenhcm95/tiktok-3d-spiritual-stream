<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phật Điện Vạn Người — TikTok Live Interactive 3D</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Importmap Three.js ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- Socket.io Client -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Khung dọc 9:16 chuẩn TikTok Live -->
  <div id="app-wrapper">
    <!-- WebGL Canvas Layer -->
    <div id="webgl-container"></div>

    <!-- DOM Layer chứa Thẻ Tên & Bong bóng Chat cầu nguyện (Tối ưu Object Pooling) -->
    <div id="labels-layer"></div>

    <!-- HUD Overlay Layer -->
    <div id="hud-layer">
      <!-- Badge Chùa góc trái trên -->
      <div id="temple-badge">
        <span class="temple-icon">🌸</span>
        <div class="temple-text">
          <div class="temple-title">CHÙA AN LẠC 3D</div>
          <div class="temple-sub">Chánh Điện Dâng Hương</div>
        </div>
      </div>

      <!-- Banner Thông báo Đỉnh Màn hình (Top Toast) -->
      <div id="top-banner-toast" class="toast-hidden">
        <span class="toast-icon">🙏</span>
        <span id="toast-text">Trântrân đã chia sẻ buổi lễ 🙏</span>
      </div>

      <!-- Bảng TẤM LÒNG THÀNH góc phải trên -->
      <div id="tam-long-thanh-panel">
        <div class="panel-header">
          <span class="gold-lotus">🪷</span>
          <span class="panel-title">TẤM LÒNG THÀNH</span>
        </div>
        <div id="fifth-seat-info" class="fifth-seat-row">
          Đệm cuối (hạng 5) có <span class="gold-coin-val">204</span> xu 🪙
        </div>
        <div id="chasers-list" class="chasers-container">
          <!-- Render danh sách bám đuổi qua HudManager -->
        </div>
        <div id="bow-counter" class="bow-badge">
          Vòng lạy: 1
        </div>
      </div>

      <!-- Nút bật âm thanh / tịnh tâm nếu trình duyệt khóa AudioContext -->
      <button id="audio-unlock-btn" title="Bật/Tắt Âm Thanh">
        <span id="audio-icon">🔊</span>
      </button>

      <!-- Nút mở Bảng Debug Admin -->
      <button id="toggle-debug-btn" title="Bảng Điều Khiển (Phím D)">⚙️</button>
    </div>

    <!-- Bảng Điều Khiển Admin & Giả Lập Debug (Phím D) -->
    <div id="debug-panel" class="debug-hidden">
      <div class="debug-header">
        <span>🎮 BẢNG ĐIỀU KHIỂN STREAMER</span>
        <button id="close-debug-btn">✕</button>
      </div>
      <div class="debug-body">
        <div class="debug-section">
          <label>Kênh TikTok LIVE (@username):</label>
          <div class="input-row">
            <input type="text" id="tiktok-user-input" placeholder="@kenh_cua_ban">
            <button id="btn-connect-tiktok">Kết Nối</button>
          </div>
          <div id="connection-status" class="status-indicator">Trạng thái: Đang ngắt</div>
        </div>

        <div class="debug-section">
          <div class="toggle-row">
            <span>Giả lập Auto-Mock:</span>
            <button id="btn-toggle-mock" class="btn-toggle active">ĐANG BẬT</button>
          </div>
          <div class="toggle-row">
            <span>Âm thanh & TTS:</span>
            <button id="btn-toggle-sound" class="btn-toggle active">ĐANG BẬT</button>
          </div>
        </div>

        <div class="debug-section">
          <label>Bắn Sự Kiện Test Nhanh:</label>
          <div class="grid-buttons">
            <button id="btn-mock-chat" class="btn-test">💬 Bong Bóng Chat</button>
            <button id="btn-mock-share" class="btn-test">🙏 Chia Sẻ Live</button>
            <button id="btn-mock-gift-small" class="btn-test">🌹 Dâng Hương (10 xu)</button>
            <button id="btn-mock-gift-vip" class="btn-test">👑 Quà Lớn Lên Đệm</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry Point Modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
